<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MalDet — Malware &amp; supply-chain scanning for GitHub repositories</title>
    <!-- description, og:title, og:description, og:image and twitter:image are injected from .figma/make/site.json -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MalDet" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MalDet — know what a repository hides before you run it." />
    <meta name="twitter:title" content="MalDet — Malware & supply-chain scanning for GitHub repositories" />
    <meta
      name="twitter:description"
      content="Paste a GitHub URL. Six detection engines, ML triage and a plain-English summary give the repo a trust score before you run it."
    />
    <meta name="theme-color" content="#f4f2eb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#07130e" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap"
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "MalDet",
        "applicationCategory": "SecurityApplication",
        "operatingSystem": "Web",
        "description": "MalDet scans public GitHub repositories for malware, vulnerable dependencies and supply-chain attacks with six detection engines, sorts findings with machine-learning triage, and gives each repository a trust score.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD", "name": "Free" }
      }
    </script>
    <script>
      // Apply stored or system theme before first paint to avoid a flash.
      ;(function () {
        var stored = null
        try {
          stored = localStorage.getItem("maldet-theme")
        } catch (e) {}
        var theme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
