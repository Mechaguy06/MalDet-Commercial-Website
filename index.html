<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MalDet — AI-Driven Malware Detection & Trust Scoring for GitHub Repositories</title>
    <meta
      name="description"
      content="MalDet scans public GitHub repositories with six detection engines, filters noise with a Random Forest classifier, and delivers clear Vulnerability and Malicious-Pattern verdicts."
    />
    <meta property="og:title" content="MalDet — AI-Driven Malware Detection & Trust Scoring" />
    <meta
      property="og:description"
      content="Know what a repository hides before you run it. Multi-engine static analysis and supply-chain risk scanning for public GitHub repositories."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0a1d15" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      // Prevent theme flash: apply stored/system theme before first paint.
      ;(function () {
        var stored = null
        try {
          stored = localStorage.getItem("maldet-theme")
        } catch (e) {}
        var theme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
